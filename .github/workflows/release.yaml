name: Release Library
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./packages/react-focus-rings

permissions:
  # To publish packages with provenance via OIDC
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - run: pnpm install

      - run: pnpm publish --access public --provenance
