name: Release Library
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./packages/react-focus-rings

permissions:
  # To publish packages with provenance via OIDC
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v2
        with:
          version: 9.12.2
      - run: pnpm install

      - run: NODE_AUTH_TOKEN="" pnpm publish --access public --provenance
