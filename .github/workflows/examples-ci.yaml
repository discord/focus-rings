name: examples-ci
on:
  pull_request:

defaults:
  run:
    working-directory: ./packages/examples

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v2
        with:
          version: 9.12.2
      - run: pnpm install

      - run: pnpm run build
      - run: pnpm run lint
